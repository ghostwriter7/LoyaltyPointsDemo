spring:
  application:
    name: LoyaltyPoints
  datasource:
    url: jdbc:mysql://localhost:3306/loyalty_points
    password: secret
    username: user
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
      acks: all
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    bootstrap-servers:
      - localhost:9092
      - localhost:9093
      - localhost:9094

